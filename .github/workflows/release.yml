name: Test and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - run: go test ./...
        if: runner.os == 'Windows'
        shell: powershell
      - run: go test ./...
        if: runner.os != 'Windows'
        shell: bash

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Build release
        run: python scripts/build.py --version "${GITHUB_REF_NAME#v}"
      - name: Check reproducibility
        run: python scripts/verify-build.py dist/noobtunnel_linux_amd64 --manifest dist/agent-release.json
      - name: Attest binaries, installers and checksums
        id: provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: dist/*
      - name: Export verification bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.jsonl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$GITHUB_REF_NAME" dist/noobtunnel_* dist/agent-release.json dist/SHA256SUMS dist/provenance.jsonl --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.txt"

  trim-assets:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Trim latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release=$(gh release view --json tagName,assets)
          tag=$(jq -r '.tagName' <<< "$release")
          for name in quick.ps1 quick.sh install.ps1 install.sh checksums.json; do
            if jq -e --arg name "$name" '.assets | any(.name == $name)' <<< "$release" > /dev/null; then
              gh release delete-asset "$tag" "$name" --yes
            fi
          done
